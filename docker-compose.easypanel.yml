# Despliegue en EasyPanel como servicio "Compose" (ver docs/despliegue-easypanel.md).
# Diferencias con docker-compose.yml: sin puertos publicados (EasyPanel enruta el dominio
# al servicio `web`, puerto 8000), sin servicios de desarrollo y SIN SeaweedFS propio:
# usa la instancia privada de SeaweedFS del mismo proyecto de EasyPanel por la red
# interna de Docker, sin SSL, a través de `s3-proxy` (S3_ENDPOINT=http://s3-proxy:8333;
# S3_SERVICIO_INTERNO=<proyecto>_<servicio>:8333). Ver docker/s3-proxy/Dockerfile.
# Fijar versiones de imágenes antes de producción (no usar :latest).
name: gestion-documental

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  s3-proxy:
    # Reenvía a la instancia privada de SeaweedFS del proyecto (S3_SERVICIO_INTERNO,
    # p. ej. estudio_seaweedfs:8333). Sin puertos publicados.
    build: ./docker/s3-proxy
    restart: unless-stopped
    environment:
      S3_SERVICIO_INTERNO: ${S3_SERVICIO_INTERNO}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      s3-proxy:
        condition: service_healthy
    command: >
      sh -c 'python manage.py migrate --noinput &&
             python manage.py preparar_almacenamiento &&
             if [ -n "$${DJANGO_SUPERUSER_USERNAME:-}" ]; then python manage.py createsuperuser --noinput || true; fi &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -'
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/salud/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      web:
        condition: service_healthy
    command: python manage.py procesar_eventos --loop

  backup:
    # Respaldo diario cifrado (restic) de base y archivos. Ver docs/respaldos.md.
    # Manual: docker compose exec backup backup.sh
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/La_Paz}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - respaldos_local:/respaldos

volumes:
  db_data:
  respaldos_local:
