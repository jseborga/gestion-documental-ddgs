[project]
name = "gestion-documental"
version = "0.1.0"
description = "Sistema de gestión documental y correspondencia (piloto DDGS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-filter>=24.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "django-otp>=1.5",
    "django-axes>=8.0",
    "qrcode>=8.0",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "DJ", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/test.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "Las apps de dominio no dependen de la capa API"
type = "forbidden"
source_modules = ["apps.core", "apps.eventos", "apps.auditoria", "apps.seguridad"]
forbidden_modules = ["apps.api"]

[[tool.importlinter.contracts]]
name = "La lógica de catálogos, bitácora y eventos no depende de seguridad"
type = "forbidden"
source_modules = [
    "apps.core.models",
    "apps.core.services",
    "apps.core.selectors",
    "apps.auditoria.models",
    "apps.auditoria.services",
    "apps.auditoria.selectors",
    "apps.eventos.models",
    "apps.eventos.services",
]
forbidden_modules = ["apps.seguridad"]
